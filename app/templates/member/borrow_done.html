{% extends "base.html" %}
{% block title %}Borrowed{% endblock %}
{% block content %}
<p class="success-mark" role="status">✓ Done! You've borrowed:</p>
<p class="confirm-title">{{ loan.book.title }}</p>
<p>Please bring it back by</p>
<p class="due-big">{{ loan.due_on | nice_date }}</p>
<p class="muted">We'll send you a reminder email a few days before.</p>
<div class="big-actions">
  <a class="btn big" href="{{ url_for('main.home') }}">Back to my books</a>
  <a class="btn big secondary" href="{{ url_for('member.borrow_search') }}">Borrow another book</a>
</div>
{% endblock %}
